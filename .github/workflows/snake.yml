name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Siddika-29s
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23EDE8D0&color_dots=%230D1117,%23064E3B,%23059669,%2310B981,%23EDE8D0
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23EDE8D0&color_dots=%230D1117,%23064E3B,%23059669,%2310B981,%23EDE8D0

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
