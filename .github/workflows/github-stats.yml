name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=Siddika-29s
            &show_icons=true
            &hide_rank=true
            &hide_title=true
            &hide_border=true
            &bg_color=0D1117
            &title_color=EDE8D0
            &text_color=E5E7EB
            &icon_color=10B981
            &border_radius=12
          path: profile/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=Siddika-29s
            &layout=compact
            &langs_count=5
            &hide_border=true
            &bg_color=0D1117
            &title_color=EDE8D0
            &text_color=E5E7EB
            &border_radius=12
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Generated Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats" || exit 0
          git push
